version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: ticketbox-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ticketbox
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
  adminer:
    image: adminer
    container_name: ticketbox-adminer
    ports:
      - "8081:8080"

  redis:
    image: redis:7-alpine
    container_name: ticketbox-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: ticketbox-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio
    container_name: ticketbox-minio
    ports:
      - "9000:9000" # API endpoint
      - "9001:9001" # Web console
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123456
    volumes:
      - ./frontend/imgs:/data
    command: server /data --console-address ":9001"

  nginx:
    image: nginx:1.27-alpine
    container_name: ticketbox-nginx
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  ngrok:
    image: ngrok/ngrok:latest
    container_name: ngrok
    networks:
      ngrok_gateway:
        ipv4_address: 172.31.250.10
    restart: unless-stopped
    depends_on:
      - nginx
    env_file:
      - ./backend/.env
    command:
      - "http"
      - "host.docker.internal:8080"
      - "--url"
      - "https://atypical-trombone-resonant.ngrok-free.dev"
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  ngrok_gateway:
    ipam:
      config:
        - subnet: 172.31.250.0/24
    
volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio-data:
