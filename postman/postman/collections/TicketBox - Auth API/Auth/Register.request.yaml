$kind: http-request
url: "{{base_url}}/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "user@example.com",
      "password": "Password123@",
      "confirm_password": "Password123@",
      "full_name": "Nguyen Van A",
      "phone": "+84987654321"
    }
auth:
  type: noauth
examples: ./.resources/Register.resources/examples
order: 1000
