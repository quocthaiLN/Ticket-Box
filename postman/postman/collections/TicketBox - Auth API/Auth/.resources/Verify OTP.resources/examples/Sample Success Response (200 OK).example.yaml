    type: json
    content: |-
      {
        "data": {
          "id": "3fa85f64-5717-4562-b3fc-2c963f66afa6",
          "email": "user@example.com",
          "full_name": "Nguyen Van A",
          "phone": "+84987654321",
          "role": "AUDIENCE",
          "status": "ACTIVE",
          "created_at": "2026-09-06T12:00:00"
        },
        "meta": {
          "request_id": "req_12345678"
        }
      }
order: 1000
