spring:
  application:
    name: ticketbox
  config:
    import:
      - file:.env[.properties]
  profiles:
    active: api

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your_google_client_id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your_google_client_secret}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ticketbox}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    repair-on-migrate: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    virtual-host: ${RABBITMQ_VHOST:/}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    ssl:
      enabled: ${RABBITMQ_SSL:false}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:your_mail_username@gmail.com}
    password: ${MAIL_PASSWORD:your_mail_password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  minio: 
    host: ${MINIO_HOST:localhost}
    port: ${MINIO_PORT:9000}
    username: ${MINIO_USER:admin}
    password: ${MINIO_PASSWORD:admin123456}
    bucket: ${MINIO_BUCKET:ticket-box-storage}
    secure: ${MINIO_SECURE:false}

jwt:
  access-token: ${JWT_ACCESS_TOKEN:test5709e9900945c4f72186cf92b6ae9ddb30eb3f3906ef92e4e3ffa2dc986f}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000}
  refresh-token: ${JWT_REFRESH_TOKEN:test040b0e64779e5a44a69ab64c59d761a13d82de8b3bf5d5a1ba5bd3012e99}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:2592000000}

app:
  otp:
    ttl-minutes: ${OTP_TTL_MINUTES:5}
  storage:
    base-url: ${STORAGE_BASE_URL:http://localhost:9000/ticket-box-storage}