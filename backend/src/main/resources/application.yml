spring:
  application:
    name: ticketbox
  config:
    import:
      - file:.env[.properties]
  profiles:
    active: api

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your_google_client_id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your_google_client_secret}
            scope: openid, profile, email

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ticketbox}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    repair-on-migrate: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    virtual-host: ${RABBITMQ_VHOST:/}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    ssl:
      enabled: ${RABBITMQ_SSL:false}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:your_mail_username@gmail.com}
    password: ${MAIL_PASSWORD:your_mail_password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  minio: 
    host: ${MINIO_HOST:localhost}
    port: ${MINIO_PORT:9000}
    username: ${MINIO_USER:admin}
    password: ${MINIO_PASSWORD:admin123456}
    bucket: ${MINIO_BUCKET:ticket-box-storage}
    secure: ${MINIO_SECURE:false}

jwt:
  access-token: ${JWT_ACCESS_TOKEN:test5709e9900945c4f72186cf92b6ae9ddb30eb3f3906ef92e4e3ffa2dc986f}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000}
  refresh-token: ${JWT_REFRESH_TOKEN:test040b0e64779e5a44a69ab64c59d761a13d82de8b3bf5d5a1ba5bd3012e99}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:2592000000}

app:
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:3001}
  oauth2:
    success-redirect-uri: ${OAUTH2_SUCCESS_REDIRECT_URI:http://localhost:3001/oauth2/callback}
    failure-redirect-uri: ${OAUTH2_FAILURE_REDIRECT_URI:http://localhost:3001/login?error=oauth2}
  otp:
    ttl-minutes: ${OTP_TTL_MINUTES:5}
  hold-duration:
    hold-minutes: ${HOLD_DURATION_MINUTE:15}
  storage:
    base-url: ${STORAGE_BASE_URL:http://localhost:9000/ticket-box-storage}
  payment:
    vnpay:
      vnpay-url: ${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      query-url: ${VNPAY_QUERY_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
      query-ip-address: ${VNPAY_QUERY_IP_ADDRESS:127.0.0.1}
      vnpay-tmn-code: ${VNPAY_TMN_CODE:TICKETBOX}
      vnpay-hash-secret: ${VNPAY_HASH_SECRET:ticketbox_secret}
      vnpay-return-url: ${VNPAY_RETURN_URL:http://localhost:3001/payment/result}
    momo:
      momo-url: ${MOMO_URL:https://test-payment.momo.vn/v2/gateway/api/create}
      query-url: ${MOMO_QUERY_URL:https://test-payment.momo.vn/v2/gateway/api/query}
      partner-code: ${MOMO_PARTNER_CODE:}
      access-key: ${MOMO_ACCESS_KEY:}
      secret-key: ${MOMO_SECRET_KEY:}
      redirect-url: ${MOMO_REDIRECT_URL:http://localhost:3001/payment/result}
      ipn-url: ${MOMO_IPN_URL:https://example.invalid/payments/momo/ipn}
  ticket:
    qr-secret: ${TICKET_QR_SECRET:}
