events {}

http {
    # Empty map keys are not counted by limit_req_zone. This keeps each route
    # in one stable policy group without using IDs or query strings as keys.
    map $uri $auth_key {
        default "";
        ~^/auth(?:/|$) $binary_remote_addr;
        ~^/oauth2(?:/|$) $binary_remote_addr;
        ~^/login/oauth2(?:/|$) $binary_remote_addr;
    }
    map $uri $catalog_key {
        default "";
        ~^/concerts$ $binary_remote_addr;
        ~^/concerts/[^/]+(?:/(?:metadata|seat-map|ticket-types|inventory))?$ $binary_remote_addr;
    }
    map $uri $order_key {
        default "";
        ~^/orders/[^/]+/payments$ "";
        ~^/orders(?:/|$) $binary_remote_addr;
    }
    map $uri $payment_key {
        default "";
        ~^/payments/(?:vnpay|momo)/ipn$ "";
        ~^/payments(?:/|$) $binary_remote_addr;
        ~^/orders/[^/]+/payments$ $binary_remote_addr;
    }
    map $uri $ipn_key {
        default "";
        ~^/payments/(?:vnpay|momo)/ipn$ $binary_remote_addr;
    }

    # Only the ngrok container on its dedicated Docker network may provide client IP.
    set_real_ip_from 172.31.250.10;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    map "$realip_remote_addr:$http_x_forwarded_proto" $upstream_proto {
        default $scheme;
        "172.31.250.10:https" https;
    }

    limit_req_zone $binary_remote_addr zone=global:10m rate=60r/s;
    limit_req_zone $auth_key zone=auth:10m rate=5r/s;
    limit_req_zone $catalog_key zone=catalog_public:10m rate=30r/s;
    limit_req_zone $order_key zone=order:10m rate=5r/s;
    limit_req_zone $payment_key zone=payment:10m rate=5r/s;
    limit_req_zone $ipn_key zone=payment_ipn:10m rate=30r/s;

    log_format rate_limit '$time_iso8601 method=$request_method uri=$uri status=$status '
                          'limit=$limit_req_status upstream=$upstream_status';
    access_log /var/log/nginx/access.log rate_limit;

    server {
        listen 8080;
        limit_req_status 429;

        # All requests carry the global limit. Route maps select one more zone.
        limit_req zone=global burst=120;
        limit_req zone=auth burst=10;
        limit_req zone=catalog_public burst=60;
        limit_req zone=order burst=10;
        limit_req zone=payment burst=10;
        limit_req zone=payment_ipn burst=60;

        error_page 429 = @rate_limited;
        location @rate_limited {
            default_type application/json;
            return 429 '{"error":{"code":"RATE_LIMITED","message":"Too many requests"}}';
        }

        location / {
            proxy_pass http://127.0.0.1:8082;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $upstream_proto;
            proxy_set_header X-Forwarded-Host $http_host;
        }
    }
}
